<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">Premium digital signature verification frame</title>
  <desc id="desc">A transparent horizontal signature frame with a verified shield badge and a clear space for a handwritten signature between two blue lines.</desc>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#087FC1"/>
      <stop offset="1" stop-color="#20B8E6"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A86C8"/>
      <stop offset="0.72" stop-color="#159FD6"/>
      <stop offset="1" stop-color="#35BCE7"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="11" flood-color="#054A70" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Signature guide rules -->
  <path d="M260 137 C300 95 350 78 418 78 H1510" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
  <path d="M260 383 C300 425 350 442 418 442 H1510" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>

  <!-- Left verification medallion -->
  <g filter="url(#shadow)">
    <circle cx="245" cy="260" r="154" fill="#FFFFFF" stroke="#D9EFF8" stroke-width="8"/>
    <circle cx="245" cy="260" r="128" fill="url(#blue)"/>
    <circle cx="245" cy="260" r="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="3"/>
  </g>

  <!-- Shield -->
  <path d="M245 160 C283 190 318 196 339 198 V258 C339 323 299 365 245 394 C191 365 151 323 151 258 V198 C172 196 207 190 245 160Z"
        fill="#FFFFFF" fill-opacity="0.98"/>
  <path d="M245 181 C276 203 303 210 319 212 V259 C319 308 291 342 245 369 C199 342 171 308 171 259 V212 C187 210 214 203 245 181Z"
        fill="url(#blue)"/>
  <path d="M203 268 L232 297 L292 228" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

</svg>
