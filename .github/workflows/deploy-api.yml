name: Deploy API

on:
  push:
    branches: [develop, main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15

    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Validate GitHub Secrets before deployment
        run: |
          node -e '
            const dbUrl = process.env.DATABASE_URL;
            if (!dbUrl || (!dbUrl.startsWith("postgres://") && !dbUrl.startsWith("postgresql://"))) {
              console.error("FATAL ERROR: DATABASE_URL secret is missing, empty, or invalid in GitHub Secrets for this environment!");
              console.error("Received value prefix:", dbUrl ? dbUrl.substring(0, 10) + "..." : "undefined");
              process.exit(1);
            }
            console.log("✅ DATABASE_URL secret validated successfully (starts with postgresql://)");
          '
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy to Cloudflare Workers
        run: |
          pnpm --filter @graphsign/api exec wrangler deploy \
            --name ${{ github.ref_name == 'main' && 'graphsign-api' || 'dev-graphsign-api' }} \
            --var WEB_URL:"${{ vars.WEB_URL || (github.ref_name == 'main' && 'https://graphsign.ink,https://www.graphsign.ink,https://graphsign-web.pages.dev,http://localhost:3000' || 'https://dev.graphsign.ink,https://dev-graphsign-web.pages.dev,http://localhost:3000') }}" \
            --var API_URL:"${{ vars.API_URL || (github.ref_name == 'main' && 'https://graphsign-api.kunal-f9f.workers.dev' || 'https://dev-graphsign-api.kunal-f9f.workers.dev') }}" \
            --var EMAIL_FROM:"${{ vars.EMAIL_FROM || 'notification@mail.graphomy.com' }}" \
            --var NODE_ENV:"${{ vars.NODE_ENV || (github.ref_name == 'main' && 'production' || 'development') }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Upload secrets to Cloudflare Worker
        run: |
          node -e '
            const secrets = {
              DATABASE_URL: process.env.DATABASE_URL || "",
              JWT_SECRET: process.env.JWT_SECRET || "",
              RESEND_API_KEY: process.env.RESEND_API_KEY || ""
            };
            if (!secrets.DATABASE_URL) console.error("WARNING: DATABASE_URL is empty in GitHub Secrets!");
            process.stdout.write(JSON.stringify(secrets));
          ' | pnpm --filter @graphsign/api exec wrangler secret bulk --name ${{ github.ref_name == 'main' && 'graphsign-api' || 'dev-graphsign-api' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
